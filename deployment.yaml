apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-test
  namespace: java-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: java-test
  template:
    metadata:
      labels:
        app: java-test
    spec:
      containers:
      - name: java-test
        image: localhost:8083/java-test:latest
        ports:
        - containerPort: 8080
